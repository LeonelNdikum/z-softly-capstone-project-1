name: Destroy ECS infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Select destroy to confirm"
        required: true
        type: choice
        options:
          - "no"
          - "destroy"
        default: "no"

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: zsoftly-capstone-web
  TF_VERSION: 1.10.5

jobs:
  destroy:
    name: Terraform destroy
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (backend from main.tf)
        run: >-
          terraform -chdir=terraform init -input=false

      - name: Show what is in state
        run: |
          terraform -chdir=terraform state list || true
          COUNT=$(terraform -chdir=terraform state list 2>/dev/null | wc -l)
          echo "Resources in state: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::State is empty. Nothing will be destroyed. Check for orphaned resources in AWS."
          fi

      # A repo that still holds images can't be deleted, so empty it first.
      - name: Delete images from ECR
        run: |
          IDS=$(aws ecr list-images --repository-name "$ECR_REPOSITORY" --query 'imageIds[*]' --output json 2>/dev/null || echo "[]")
          if [ "$IDS" != "[]" ] && [ -n "$IDS" ]; then
            aws ecr batch-delete-image --repository-name "$ECR_REPOSITORY" --image-ids "$IDS" > /dev/null
          else
            echo "No images to delete."
          fi

      - name: Destroy infrastructure
        run: >-
          terraform -chdir=terraform destroy -input=false -auto-approve
          -var="image_tag=destroy"
          -var="ecr_repository_name=${ECR_REPOSITORY}"