uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push commit-tagged image to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "zsoftly-capstone-web:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Set up Terraform
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize Terraform
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform -chdir=terraform init -input=false

      - name: Plan infrastructure and image deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: >-
          terraform -chdir=terraform plan -input=false -out=tfplan
          -var="image_tag=${IMAGE_TAG}"
          -var="ecr_repository_name=${ECR_REPOSITORY}"

      - name: Apply infrastructure and deploy image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan
