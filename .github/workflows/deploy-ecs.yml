name: Build, scan, and deploy to ECS

on:
  pull_request:
    branches: [main]
    paths:
      - "application/**"
      - "terraform/**"
      - ".github/workflows/deploy-ecs.yml"
  push:
    branches: [main]
    paths:
      - "application/**"
      - "terraform/**"
      - ".github/workflows/deploy-ecs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: zsoftly-capstone-web

jobs:
  build-and-scan:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag "zsoftly-capstone-web:${GITHUB_SHA}" ./application

      - name: Scan image with Trivy
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.64.1 image
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --scanners vuln
          "zsoftly-capstone-web:${GITHUB_SHA}"

  deploy:
    name: Push to ECR and deploy to ECS
    needs: build-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ while (length($0)%4) $0=$0"="; print }' \
            | base64 -d | jq '{sub, aud, iss, repository}'

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build --pull --tag "zsoftly-capstone-web:${GITHUB_SHA}" ./application

      - name: Tag and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "zsoftly-capstone-web:${IMAGE_TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Plan infrastructure and image deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: >-
          terraform -chdir=terraform plan -input=false -out=tfplan
          -var="image_tag=${IMAGE_TAG}"
          -var="ecr_repository_name=${ECR_REPOSITORY}"
