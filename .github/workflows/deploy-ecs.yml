name: Build, scan, and deploy to ECS

on:
  pull_request:
    branches: [main]
    paths:
      - "application/**"
      - "terraform/**"
      - ".github/workflows/deploy-ecs.yml"
  push:
    branches: [main]
    paths:
      - "application/**"
      - "terraform/**"
      - ".github/workflows/deploy-ecs.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: zsoftly-capstone-web
  IMAGE_NAME: zsoftly-capstone-web
  TF_VERSION: 1.10.5
  TF_STATE_BUCKET: zsoftly-capstone-tfstate-156
  TF_STATE_REGION: us-east-1 # region of the state bucket, not of the app

jobs:
  # Every PR and push: build ONCE, scan that exact image, validate Terraform.
  build-and-scan:
    name: Build, scan and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull --tag "${IMAGE_NAME}:${GITHUB_SHA}" ./application

      - name: Save image to tarball
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o image.tar

      - name: Scan image with Trivy
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/work"
          aquasec/trivy:0.64.1 image
          --input /work/image.tar
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --scanners vuln

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend) and validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Upload image for deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  deploy:
    name: Create ECR, push image, deploy to ECS
    needs: build-and-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: docker load -i image.tar

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (S3 backend)
        run: >-
          terraform -chdir=terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=capstone/terraform.tfstate"
          -backend-config="region=${TF_STATE_REGION}"

      # Step 1: the repo must exist before we can push, so create only the ECR repo first.
      - name: Terraform apply - ECR repository only
        run: >-
          terraform -chdir=terraform apply -input=false -auto-approve
          -target=aws_ecr_repository.app
          -target=aws_ecr_lifecycle_policy.app
          -var="image_tag=${GITHUB_SHA}"
          -var="ecr_repository_name=${ECR_REPOSITORY}"

      # Step 2: push the scanned image.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

      # Step 3: full plan/apply, now the image exists for ECS to pull.
      - name: Terraform plan - full infrastructure
        run: >-
          terraform -chdir=terraform plan -input=false -out=tfplan
          -var="image_tag=${GITHUB_SHA}"
          -var="ecr_repository_name=${ECR_REPOSITORY}"

      - name: Terraform apply - deploying to ECS
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      - name: Wait for ECS service to become stable
        run: |
          CLUSTER=$(terraform -chdir=terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform -chdir=terraform output -raw ecs_service_name)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "Deployed ${GITHUB_SHA} to ${CLUSTER}/${SERVICE}" >> "$GITHUB_STEP_SUMMARY"