name: ZSoftly Capstone CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "application/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "application/**"
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: zsoftly-capstone-web

jobs:
  build-and-scan:
    name: Build and Scan Docker Image
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t "zsoftly-capstone-web:${GITHUB_SHA}" \
            ./application

      - name: Scan image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            "zsoftly-capstone-web:${GITHUB_SHA}"

  deploy:
    name: Push to ECR and Deploy to ECS
    needs: build-and-scan
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: self-hosted

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image for deployment
        run: |
          docker build \
            -t "zsoftly-capstone-web:${GITHUB_SHA}" \
            ./application

      - name: Push commit-tagged image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            "zsoftly-capstone-web:${IMAGE_TAG}" \
            "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker push \
            "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Plan infrastructure and image deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform -chdir=terraform plan \
            -input=false \
            -out=tfplan \
            -var="image_tag=${IMAGE_TAG}" \
            -var="ecr_repository_name=${ECR_REPOSITORY}"

      - name: Apply infrastructure and deploy image
        run: |
          terraform -chdir=terraform apply \
            -input=false \
            -auto-approve \
            tfplan
