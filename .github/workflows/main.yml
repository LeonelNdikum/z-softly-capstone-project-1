
name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform:
    name: Terraform Validation
    runs-on: self-hosted
    timeout-minutes: 30

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Install / Override Terraform
      # -----------------------------------------
      - name: Install Terraform
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget unzip

          TERRAFORM_VERSION="1.13.5"

          echo "Installing Terraform ${TERRAFORM_VERSION}..."

          wget -q -O /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"

          unzip -o /tmp/terraform.zip -d /tmp/terraform

          # Override existing Terraform
          sudo rm -f /usr/local/bin/terraform
          sudo mv /tmp/terraform/terraform /usr/local/bin/terraform

          sudo chmod +x /usr/local/bin/terraform

          rm -rf /tmp/terraform /tmp/terraform.zip

      - name: Check Terraform version
        run: |
          terraform version

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          terraform validate


  docker:
    name: Docker Build and Security Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Install / Override Docker
      # -----------------------------------------
      - name: Install Docker
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            curl \
            gnupg

          sudo install -m 0755 -d /etc/apt/keyrings

          sudo curl -fsSL \
            https://download.docker.com/linux/ubuntu/gpg \
            -o /etc/apt/keyrings/docker.asc

          sudo chmod a+r /etc/apt/keyrings/docker.asc

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
            $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

          sudo apt-get update

          # Override / upgrade existing Docker packages
          sudo apt-get install -y --only-upgrade \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin || \
          sudo apt-get install -y \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin

          sudo systemctl enable docker
          sudo systemctl restart docker

          # Make sure the runner user can use Docker
          sudo usermod -aG docker "$USER"

      - name: Check Docker version
        run: |
          docker --version
          docker compose version


      # -----------------------------------------
      # Install / Override Trivy
      # -----------------------------------------
      - name: Install Trivy
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release

          wget -qO- \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo \
            "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          # Install or upgrade Trivy
          sudo apt-get install -y --only-upgrade trivy || \
          sudo apt-get install -y trivy

      - name: Check Trivy version
        run: |
          trivy --version


      # -----------------------------------------
      # Build Docker image
      # -----------------------------------------
      - name: Build Docker image
        working-directory: application
        run: |
          docker build \
            --no-cache \
            -t zsoftly-capstone-web:${{ github.sha }} \
            .


      # -----------------------------------------
      # Trivy Docker image security scan
      # -----------------------------------------
      - name: Scan Docker image
        run: |
          trivy image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            zsoftly-capstone-web:${{ github.sha }}
