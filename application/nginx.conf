events {}

http {
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index page1.html;

        location = /page1 {
            try_files /page1.html =404;
        }

        location = /page2 {
            try_files /page2.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
